<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shubhangi & Durgesh Wedding</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="card-container">
        <div id="gatefold" class="closed">
            <div class="panel panel-left"></div>
            <div class="panel panel-right"></div>

            <div class="gold-seal" id="sealButton">
                <span>SD</span>
            </div>
        </div>

        <div id="inner-page">
            <header>
                <h2 class="ganesha">|| Shree Ganeshay Namah ||</h2>
                <h1 class="main-title">Wedding Invitation</h1>
            </header>

            <section class="couple-section">
                <div class="profile">
                    <img src="images/bride.png" alt="Shubhangi">
                    <h1 class="name">Shubhangi</h1>
                </div>
                
                <div class="weds-text">weds</div>

                <div class="profile">
                    <img src="images/groom.png" alt="Durgesh">
                    <h1 class="name">Durgesh</h1>
                </div>
            </section>

            <section class="event-details">
                <p class="invite-msg">Together with our families, we invite you to celebrate our wedding.</p>
                
                <div class="date-ribbon">
                    13 MAY 2026
                </div>

                <div class="animation-container">
                    <span class="char groom-icon">🤵</span>
                    <span class="char bride-icon">👰</span>
                </div>
                
                <div class="info-grid">
                    <p><strong>Venue:</strong> The Royal Palace, Mumbai</p>
                    <p><strong>Time:</strong> 7:00 PM Onwards</p>
                </div>
            </section>
            
            <section class="photo-footer">
                <img src="images/together.png" alt="Shubhangi and Durgesh" class="couple-full">
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
