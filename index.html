<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Wedding Invitation</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="patrika-container" class="closed">
        <div class="envelope-top"></div>
        <div class="card-front">
            <h1>Our Wedding</h1>
            <p>Click to Open</p>
        </div>
    </div>

    <div id="main-content" class="hidden">
        <section class="hero">
            <h2 class="animate-text">You are Invited!</h2>
            <div class="couple-reveal">
                <img src="images/groom.jpg" alt="Groom" class="side-img left">
                <span class="weds">&</span>
                <img src="images/bride.jpg" alt="Bride" class="side-img right">
            </div>
            <h1 class="names">Groom & Bride</h1>
        </section>

        <section class="details">
            <h3>Save the Date</h3>
            <p>June 20, 2026</p>
            <p>At 7:00 PM</p>
            <div class="final-photo">
                <img src="images/together.jpg" alt="Together" class="full-img">
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
