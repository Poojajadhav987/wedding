<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shubhangi & Durgesh</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="card-container">
        <div id="gatefold">
            <div class="panel panel-left"></div>
            <div class="panel panel-right"></div>
            <div class="gold-seal" id="sealButton"><span>Open</span></div>
        </div>

        <div id="main-content" class="hidden">
            <section class="hero">
                <h2 class="animate-text">You are Invited!</h2>
                <div class="couple-reveal">
                    <img src="images/bride.png" alt="Shubhangi" class="side-img left">
                    <span class="weds">&</span>
                    <img src="images/groom.png" alt="Durgesh" class="side-img right">
                </div>
                <h1 class="names">Shubhangi & Durgesh</h1>
            </section>

            <section class="details">
                <h3>Are Getting Married!</h3>
                <p class="wedding-date">13 May 2026</p>
                <p>At 7:00 PM</p>
                
                <div class="animation-box">
                    <div class="character groom-char">🤵</div>
                    <div class="character bride-char">👰</div>
                </div>

                <div class="final-photo">
                    <img src="images/together.png" alt="Together" class="full-img">
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
